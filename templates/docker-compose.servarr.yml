# ==============================================================================
# Servarr & Jellyfin Media Stack Docker Compose Blueprint
# Includes 4K Intel QuickSync hardware transcoding and VPN download shielding.
# ==============================================================================

version: "3.8"

networks:
  servarr-net:
    driver: bridge

services:
  # ==========================================
  # Homepage: Unified Family Portal
  # ==========================================
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "80:3000"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # VPN Shield (Gluetun WireGuard Gateway)
  # ==========================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER:-custom}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${VPN_COUNTRY:-Canada}
      - FIREWALL_OUTBOUND_SUBNETS=${HOMELAB_SUBNET:-192.168.1.0/24}
    ports:
      # qBittorrent WebUI & Torrent Port routed through VPN
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
      # NZBGet WebUI routed through VPN
      - "6789:6789"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # Torrent Client (Shielded by Gluetun VPN)
  # ==========================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${STORAGE_PATH}/downloads:/data/downloads
    restart: unless-stopped
    depends_on:
      - gluetun

  # ==========================================
  # Usenet Downloader (Shielded by Gluetun VPN)
  # ==========================================
  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
    volumes:
      - ./config/nzbget:/config
      - ${STORAGE_PATH}/downloads:/data/downloads
    restart: unless-stopped
    depends_on:
      - gluetun

  # ==========================================
  # Jellyfin Media Server (QuickSync Transcoding)
  # ==========================================
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./config/jellyfin:/config
      - ${STORAGE_PATH}/media:/data/media:ro
    ports:
      - "8096:8096"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # Jellyseerr (Media Request Portal)
  # ==========================================
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TIMEZONE:-America/Vancouver}
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # Indexer Gateway (Prowlarr)
  # ==========================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # Movie Automation (Radarr)
  # ==========================================
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
    volumes:
      - ./config/radarr:/config
      - ${STORAGE_PATH}/media/movies:/data/media/movies
      - ${STORAGE_PATH}/downloads:/data/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # TV Show Automation (Sonarr)
  # ==========================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
    volumes:
      - ./config/sonarr:/config
      - ${STORAGE_PATH}/media/tv:/data/media/tv
      - ${STORAGE_PATH}/downloads:/data/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # Subtitle Automation (Bazarr)
  # ==========================================
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
    volumes:
      - ./config/bazarr:/config
      - ${STORAGE_PATH}/media/movies:/data/media/movies
      - ${STORAGE_PATH}/media/tv:/data/media/tv
    ports:
      - "6767:6767"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # Music Automation (Lidarr)
  # ==========================================
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
    volumes:
      - ./config/lidarr:/config
      - ${STORAGE_PATH}/media/music:/data/media/music
      - ${STORAGE_PATH}/downloads:/data/downloads
    ports:
      - "8686:8686"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # Torrent / Usenet IRC Announce Grabber (Autobrr)
  # ==========================================
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    environment:
      - TZ=${TIMEZONE:-America/Vancouver}
    volumes:
      - ./config/autobrr:/config
    ports:
      - "7474:7474"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # Audiobook & Podcast Server (Audiobookshelf)
  # ==========================================
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - AUDIOBOOKSHELF_UID=1000
      - AUDIOBOOKSHELF_GID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
    volumes:
      - ./config/audiobookshelf/config:/config
      - ./config/audiobookshelf/metadata:/metadata
      - ${STORAGE_PATH}/media/audiobooks:/data/media/audiobooks
      - ${STORAGE_PATH}/media/podcasts:/data/media/podcasts
    ports:
      - "13378:80"
    restart: unless-stopped
    networks:
      - servarr-net

  # ==========================================
  # Audiobook Discovery & Request Portal (AudiobookRequest)
  # ==========================================
  audiobookrequest:
    image: markbeep/audiobookrequest:latest
    container_name: audiobookrequest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Vancouver}
      - ABR_APP__FORWARDED_ALLOW_IPS=*
    volumes:
      - ./config/audiobookrequest:/config
      - ./audiobookrequest/prowlarr.py:/app/app/internal/prowlarr/prowlarr.py:ro
      - ${STORAGE_PATH}/media/audiobooks:/data/media/audiobooks
    ports:
      - "8765:8000"
    restart: unless-stopped
    networks:
      - servarr-net

