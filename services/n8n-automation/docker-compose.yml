# ==============================================================================
# n8n Workflow Automation Engine Docker Compose Blueprint
# Includes webhook ingress and persistent volume mapping.
# ==============================================================================

version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-app
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-192.168.1.247}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://${N8N_HOST:-192.168.1.247}:5678/
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Vancouver}
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./data:/home/node/.n8n
