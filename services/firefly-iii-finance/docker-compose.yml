# ==============================================================================
# Firefly III Personal & Family Finance Docker Compose Blueprint
# Includes MariaDB database and Firefly III Core engine with REST API.
# ==============================================================================

version: "3.8"

services:
  firefly_db:
    image: mariadb:11
    container_name: firefly_db
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: firefly
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: firefly
    volumes:
      - ./db_data:/var/lib/mysql

  firefly_app:
    image: fireflyiii/core:latest
    container_name: firefly_app
    restart: unless-stopped
    depends_on:
      - firefly_db
    ports:
      - "80:8080"
    environment:
      - APP_KEY=${APP_KEY}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-http://192.168.1.245}
      - DB_CONNECTION=mysql
      - DB_HOST=firefly_db
      - DB_PORT=3306
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=${TIMEZONE:-America/Vancouver}
      - TRUSTED_PROXIES=**
    volumes:
      - ./upload_data:/var/www/html/storage/upload
