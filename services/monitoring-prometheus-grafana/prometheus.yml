# ==============================================================================
# Prometheus Scraping Configuration Blueprint
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Local container node metrics
  - job_name: "local-node-exporter"
    static_configs:
      - targets: ["localhost:9100"]

  # Proxmox VE Hypervisor Host Metrics
  - job_name: "pve-host"
    static_configs:
      - targets: ["192.168.1.250:9100"]

  # TrueNAS SCALE ZFS Metrics
  - job_name: "truenas-scale"
    static_configs:
      - targets: ["192.168.1.139:9100"]
